name: Figurinha
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"

packages:
  SDWebImageWebPCoder:
    url: https://github.com/SDWebImage/SDWebImageWebPCoder
    from: 0.14.6

targets:
  Figurinha:
    type: application
    platform: iOS
    sources:
      - path: Audio.swift
      - path: EditorView.swift
      - path: FigurinhaApp.swift
      - path: PackView.swift
      - path: Theme.swift
    dependencies:
      - package: SDWebImageWebPCoder
        product: SDWebImageWebPCoder
    info:
      properties:
        CFBundleDisplayName: Figurinhas
        UILaunchScreen: {}
        LSApplicationQueriesSchemes:
          - whatsapp
        NSMicrophoneUsageDescription: "Permitir gravar áudio para figurinhas."
        NSPhotoLibraryUsageDescription: "Permitir selecionar fotos para criar figurinhas."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.figurinha
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
