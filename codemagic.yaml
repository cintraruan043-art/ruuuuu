workflows:
  ipa-sem-assinatura:
    name: IPA sem assinatura
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
    scripts:
      - name: Instalar XcodeGen
        script: |
          set -euo pipefail
          brew install xcodegen
      - name: Gerar projeto Xcode
        script: |
          set -euo pipefail
          echo "Diretorio atual:"; pwd
          ls -la
          test -f project.yml || { echo "ERRO: project.yml nao esta na raiz do checkout."; exit 1; }
          xcodegen generate --spec ./project.yml
          test -d Figurinha.xcodeproj || { echo "ERRO: XcodeGen nao criou Figurinha.xcodeproj"; exit 1; }
      - name: Resolver pacotes (SPM)
        script: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -project Figurinha.xcodeproj -scheme Figurinha
      - name: Archive sem assinatura
        script: |
          set -euo pipefail
          rm -rf build
          xcodebuild -project Figurinha.xcodeproj -scheme Figurinha \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Figurinha.xcarchive \
            -skipPackagePluginValidation -skipMacroValidation \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Empacotar IPA
        script: |
          set -euo pipefail
          APP="build/Figurinha.xcarchive/Products/Applications/Figurinha.app"
          test -d "$APP" || { echo "ERRO: .app nao encontrado"; find build -maxdepth 4; exit 1; }
          rm -rf Payload Figurinha-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr Figurinha-unsigned.ipa Payload
    artifacts:
      - Figurinha-unsigned.ipa
      - build/Figurinha.xcarchive
